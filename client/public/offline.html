<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Pathshala — Offline</title>
  <style>
    body { margin: 0; font-family: -apple-system, sans-serif; background: #0f2d6b; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .card { background: rgba(255,255,255,.1); border-radius: 20px; padding: 40px 32px; max-width: 360px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: rgba(255,255,255,.7); line-height: 1.6; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    button { background: #F4622A; color: #fff; border: none; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📴</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Photos you take during the session will be saved on your device and uploaded automatically when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
